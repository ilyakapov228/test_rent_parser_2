default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: realty_parser_development

test:
  <<: *default
  database: realty_parser_test

production:
  url: <%= ENV['DATABASE_URL'] %>
  username: <%= ENV['POSTGRES_USERNAME'] %>
  password: <%= ENV['POSTGRES_PASSWORD'] %>
  database: <%= ENV['DATABASE_NAME'] %>
  timeout: 5000
